[package]
name = "lunar-desktop"
version = "0.1.0"
edition = "2021"
description = "Minimal macOS Sonoma-inspired desktop shell for KDE Plasma"
license = "MIT"
build = "build.rs"

[[bin]]
name = "lunar-dock-tracker"
path = "src/bin/lunar-dock-tracker.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
toml = "1"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
